<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOS Screen</title>
    <link rel="stylesheet" href="/static/css/screen.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="display-wrapper">
        <div id="display"></div>
        <video id="video-player" class="video-player hidden" muted autoplay playsinline preload="auto"></video>
        <div id="idle-screen">
            <div class="idle-content">
                <div class="idle-logo">DOS SCREEN</div>
                <div class="idle-sub">Waiting for content...</div>
                <div class="idle-dot-row">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>

        <!-- Countdown Screen -->
        <div id="countdown-screen" class="hidden">
            <div class="cd-body">
                <div class="cd-loading-label">LOADING...</div>
                <div class="cd-progress-wrap">
                    <div class="cd-progress-bar" id="cd-progress-bar"></div>
                </div>
                <div class="cd-progress-pct" id="cd-progress-pct">0%</div>
                <div class="cd-timer">
                    <div class="cd-unit">
                        <div class="cd-number" id="cd-days">00</div>
                        <div class="cd-unit-label">DAYS</div>
                    </div>
                    <div class="cd-colon">:</div>
                    <div class="cd-unit">
                        <div class="cd-number" id="cd-hours">00</div>
                        <div class="cd-unit-label">HRS</div>
                    </div>
                    <div class="cd-colon">:</div>
                    <div class="cd-unit">
                        <div class="cd-number" id="cd-minutes">00</div>
                        <div class="cd-unit-label">MIN</div>
                    </div>
                    <div class="cd-colon">:</div>
                    <div class="cd-unit">
                        <div class="cd-number" id="cd-seconds">00</div>
                        <div class="cd-unit-label">SEC</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/static/js/screen.js"></script>
</body>
</html>
